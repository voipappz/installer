  # MOVED FROM mothership/packer/autoinstall/network.default.yaml, unchanged
  # except that the note about `voipappz setup` deriving the node's address now
  # names install.sh, which does the same thing on this disc.
  #
  # DHCP on every ethernet interface — the default, and the right one for a lab,
  # a hypervisor, or any site that hands out addresses.
  #
  # `match: name: "en*"` rather than a fixed interface name: predictable names
  # (ens3, enp0s5, eno1) depend on firmware and slot, so a disc naming one
  # builds exactly one machine. The glob covers all of them.
  #
  # optional: true so a machine with several NICs, only one of which is plugged
  # in, still boots promptly. Without it systemd-networkd-wait-online blocks for
  # its full 2-minute timeout on every unplugged interface before the login
  # prompt appears — which reads as a hang on a node that is perfectly fine.
  #
  # For a static address, copy this file, replace the ethernets block, and pass
  # it with --network / -var network=<file>. A VoIP node usually wants one:
  # install.sh derives the internal address from the interface holding the
  # default route, and a node that later loses its lease binds Kamailio to an
  # address that is gone.
  #
  # Keep the two-space indent: this is substituted in as the `network:` key
  # under `autoinstall:`.
  network:
    version: 2
    ethernets:
      all-en:
        match:
          name: "en*"
        dhcp4: true
        optional: true
