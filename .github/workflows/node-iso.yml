name: Node ISO

# Cut the offline VA-Crystal NODE installer ISO and publish it to S3.
#
# ---------------------------------------------------------------- TWO VERSIONS
#
# They are different numbers and this repository owns exactly one of them.
#
#   image_version    INPUT, required, pinned. The va-crystal node image tag to
#                    bake: nirlevi/va-crystal:node-<image_version>. That version
#                    space belongs to va-crystal; this repository consumes it and
#                    never invents it. `latest` is rejected here and again by
#                    node-iso.pkr.hcl's own validation — a disc cut today must
#                    install the same software next year.
#
#   release_version  MINTED HERE. This disc's own release, in va-crystal's shape:
#                    <YYYY.MM.DD>-<serial>, today's date and the first serial the
#                    bucket does not already carry. The ISO is named by it. A
#                    disc re-cut around an UNCHANGED image — a fixed autoinstall,
#                    a newer package closure — is a new release of the same
#                    image, and that is the whole reason the two numbers are
#                    separate.
#
# The bucket is the source of truth for the serial, exactly as the registry is in
# va-crystal's scripts/release.sh: a version consumed by a run that failed before
# it uploaded anything must not block today's serial. Nothing is committed and no
# state is written at mint time, so a build that dies after minting leaves the
# serial free and the next run takes it again. The serial is consumed only by an
# object actually landing in S3.
#
# The listing is deliberately of the ISO prefix and not of Docker Hub: the tags
# in the registry are the IMAGE's version space, and asking them what media
# exists would answer a different question.
#
# `release_version` can be overridden for a re-cut, the way va-crystal takes
# VA_RELEASE_VERSION.
#
# It runs on a plain hosted runner because the build has no VM in it — the
# template's source is `null` with `communicator = "none"`, so remastering is
# xorriso unpacking one ISO and writing another. No KVM, no nested
# virtualisation, no self-hosted runner.
#
# ---------------------------------------------------------------- AWS access
#
# This repository is PUBLIC, so there are no long-lived AWS keys in it. The
# upload assumes a role through GitHub's OIDC provider, which needs three things
# in the AWS account that owns `voipappz-assets-il`:
#
# 1. An OIDC identity provider for GitHub, once per account:
#      URL      https://token.actions.githubusercontent.com
#      Audience sts.amazonaws.com
#
# 2. A role whose TRUST POLICY allows this repository and nothing else. The
#    `sub` condition is the whole security boundary — without it, any repository
#    on GitHub can assume the role:
#
#      {
#        "Version": "2012-10-17",
#        "Statement": [{
#          "Effect": "Allow",
#          "Principal": {
#            "Federated": "arn:aws:iam::<account-id>:oidc-provider/token.actions.githubusercontent.com"
#          },
#          "Action": "sts:AssumeRoleWithWebIdentity",
#          "Condition": {
#            "StringEquals": {
#              "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
#            },
#            "StringLike": {
#              "token.actions.githubusercontent.com:sub": "repo:voipappz/installer:*"
#            }
#          }
#        }]
#      }
#
#    Narrow the `sub` further if only one branch should publish, e.g.
#    "repo:voipappz/installer:ref:refs/heads/main".
#
# 3. A permissions policy scoped to that one prefix and nothing else — writing
#    a disc, and listing NAMES so the release version can be minted:
#
#      {
#        "Version": "2012-10-17",
#        "Statement": [
#          { "Effect": "Allow",
#            "Action": ["s3:PutObject", "s3:AbortMultipartUpload"],
#            "Resource": "arn:aws:s3:::voipappz-assets-il/iso/*" },
#          { "Effect": "Allow",
#            "Action": "s3:ListBucket",
#            "Resource": "arn:aws:s3:::voipappz-assets-il",
#            "Condition": { "StringLike": { "s3:prefix": "iso/*" } } }
#        ]
#      }
#
#    ListBucket returns key names and sizes, not content — it is what "which
#    serials exist today" needs and no more. Deliberately absent:
#    s3:PutObjectAcl (this role must not be able to make a disc public),
#    s3:GetObject (it writes discs, it does not read the shelf back), and every
#    resource outside iso/* — in particular images/*, which is what install.sh
#    downloads.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_OIDC_ROLE_ARN   the role above. Without it the build still runs and the
#                       ISO is left as a workflow artifact; nothing is uploaded.
#   ISO_S3_BUCKET       default voipappz-assets-il
#   ISO_S3_PREFIX       default iso/
#   ISO_S3_REGION       default il-central-1
#
# ---------------------------------------------------------------- RESTRICTED
#
# The disc is NOT public, and this workflow does nothing that would make it
# public. It carries a `docker save` of the PRIVATE nirlevi/va-crystal node
# image: anyone who can download the ISO can `docker load` that image straight
# out of the payload, so the disc is exactly as restricted as the image is.
#
#   * No ACL is set on the upload. The object inherits the bucket's settings,
#     and this bucket has Block Public Access on — an anonymous GET of the
#     existing images/va-crystal-node-latest.tar.gz already returns 403. Nothing
#     here fights that.
#   * The role above cannot set an ACL: s3:PutObjectAcl is not in its policy.
#   * Handing a disc to a customer is a PRESIGNED URL, minted by a human, out of
#     band — see packer/scripts/presign-iso.sh. A presigned URL is a bearer
#     credential: anyone holding it can download. It is therefore never minted
#     here and never printed into a job log, because a job log on a public
#     repository is world-readable.
#
# ---------------------------------------------------------------- not a release
#
# The ISO is NOT attached to a GitHub Release. A release asset is capped at 2GB
# and this disc is about 3GB, so the upload would fail at the end of a
# forty-minute build. The checksum and the notes are small enough to publish
# anywhere; the disc itself lives in S3.

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Node image version to BAKE, pinned — e.g. 2026.08.27-2. Becomes nirlevi/va-crystal:node-<image_version>. va-crystal owns this number.'
        required: true
        type: string
      release_version:
        description: "This disc's own release version. Empty mints <today>-<next free serial> from the bucket. Set it only to re-cut an existing release."
        required: false
        type: string
        default: ''
      release:
        description: "Publish a GitHub Release naming this disc (the ISO itself stays in S3)."
        type: boolean
        default: true
      s3_prefix:
        description: 'Key prefix in the bucket. Empty uses the ISO_S3_PREFIX repository variable, or iso/.'
        required: false
        type: string
        default: ''
      publish:
        description: 'Upload to S3. Off cuts the ISO and leaves the checksum as a workflow artifact.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  # The OIDC token the AWS role is assumed with. Nothing else in this repository
  # needs it, which is why it is granted here and not workflow-wide in ci.yml.
  id-token: write

concurrency:
  # ONE run at a time, repository-wide — not one per version. Two concurrent
  # runs would list the bucket at the same moment, see the same free serial, and
  # mint the same release for two different discs.
  group: node-iso
  cancel-in-progress: false

jobs:
  iso:
    name: node ISO from image ${{ inputs.image_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      IMAGE_VERSION: ${{ inputs.image_version }}
      S3_BUCKET: ${{ vars.ISO_S3_BUCKET || 'voipappz-assets-il' }}
      S3_REGION: ${{ vars.ISO_S3_REGION || 'il-central-1' }}
      S3_PREFIX: ${{ inputs.s3_prefix != '' && inputs.s3_prefix || (vars.ISO_S3_PREFIX || 'iso/') }}

    steps:
      - uses: actions/checkout@v7

      - name: Reject an unpinned image version
        run: |
          set -eu
          case "$IMAGE_VERSION" in
            latest|'') echo "!! the image must be pinned, never 'latest'" >&2; exit 1 ;;
            *[!A-Za-z0-9._-]*) echo "!! version may only hold A-Z a-z 0-9 . _ -" >&2; exit 1 ;;
          esac
          echo "baking nirlevi/va-crystal:node-$IMAGE_VERSION"

      # Minting reads the bucket, so the role is assumed here — and again, in a
      # fresh session, before the upload. Two short sessions rather than one held
      # open across a build that can run for an hour: an OIDC role session is one
      # hour by default, and a session that expires mid-build fails at the very
      # last step with nothing to show for it.
      # TWO WAYS IN, and the role is preferred when both are set. An OIDC token
      # lives an hour and cannot be replayed; a stored key is valid until
      # someone rotates it and is readable by anything that can add a workflow
      # step. Both are scoped to PutObject on one prefix, so the blast radius is
      # the same — the difference is how long a leak stays useful.
      - name: Credentials from a stored key
        if: ${{ vars.AWS_OIDC_ROLE_ARN == '' && secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.ISO_S3_REGION || 'il-central-1' }}

      - name: Assume the publishing role (to mint)
        if: ${{ vars.AWS_OIDC_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          role-session-name: node-iso-mint-${{ github.run_id }}
          aws-region: ${{ vars.ISO_S3_REGION || 'il-central-1' }}

      - name: Mint the release version
        id: mint
        env:
          OVERRIDE: ${{ inputs.release_version }}
          HAVE_ROLE: ${{ vars.AWS_OIDC_ROLE_ARN != '' }}
        run: |
          set -eu
          if [ -n "$OVERRIDE" ]; then
            case "$OVERRIDE" in
              latest) echo "!! media is pinned; there is no 'latest' release" >&2; exit 1 ;;
              *[!A-Za-z0-9._-]*) echo "!! version may only hold A-Z a-z 0-9 . _ -" >&2; exit 1 ;;
            esac
            version="$OVERRIDE"
            echo "release $version (explicit override — re-cut)"
          elif [ "$HAVE_ROLE" != "true" ]; then
            echo "!! nothing to mint from: AWS_OIDC_ROLE_ARN is unset, so the" >&2
            echo "   bucket cannot be listed. Pass release_version explicitly." >&2
            exit 1
          else
            # Today's date, then the first serial the bucket does not already
            # carry — the same shape and the same reasoning as va-crystal's
            # scripts/release.sh, with S3 standing in for the registry.
            #
            # ONE list-objects call, not a head-object per candidate: listing
            # needs only s3:ListBucket, which returns key NAMES, while
            # head-object would need s3:GetObject on the disc itself — a much
            # broader grant for a question about names.
            #
            # Nothing is written here and nothing is committed, so a run that
            # dies after this point leaves the serial free for the next one. A
            # serial is consumed only by an object actually landing in S3.
            prefix="${S3_PREFIX%/}/"
            case "$prefix" in /*) prefix="${prefix#/}" ;; esac
            today="$(date -u +%Y.%m.%d)"
            # Fatal if the listing fails: an unanswered bucket must not be read
            # as an empty one, or the run mints a serial that already exists and
            # overwrites a published disc.
            taken="$(aws s3api list-objects-v2 \
                       --bucket "$S3_BUCKET" \
                       --prefix "${prefix}voipappz-node-${today}-" \
                       --query 'Contents[].Key' --output text \
                       --region "$S3_REGION" | tr '\t' '\n')" \
              || { echo "!! could not list s3://$S3_BUCKET/$prefix" >&2; exit 1; }
            serial=1
            while printf '%s\n' "$taken" \
                  | grep -qx "${prefix}voipappz-node-${today}-${serial}.iso"; do
              serial=$((serial + 1))
              if [ "$serial" -ge 100 ]; then
                echo "!! 100 releases today? check s3://$S3_BUCKET/$prefix" >&2
                exit 1
              fi
            done
            version="${today}-${serial}"
            echo "release $version (first free serial for $today)"
          fi
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "iso_name=voipappz-node-$version.iso" >> "$GITHUB_OUTPUT"

      - name: Carry the minted version through the job
        run: |
          set -eu
          {
            echo "RELEASE_VERSION=${{ steps.mint.outputs.release_version }}"
            echo "ISO_NAME=${{ steps.mint.outputs.iso_name }}"
          } >> "$GITHUB_ENV"

      # The default runner image leaves about 25GB free. This build needs the
      # base ISO (3GB) + the remastered ISO (3GB) + the saved image archive +
      # the pulled image's layer store, and running out shows up as a truncated
      # ISO rather than a clean failure. These four directories are the big,
      # unrelated toolchains.
      - name: Free disk space
        run: |
          set -eu
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Install xorriso
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso
          xorriso --version 2>&1 | head -2

      - name: Install Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: latest

      # The node image is private. The login writes a credential into the
      # runner's docker config; it is removed in the final step, which runs even
      # when the build failed.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fetch the Ubuntu base ISO
        run: packer/scripts/fetch-base-iso.sh

      - name: Validate the template
        run: |
          packer/build.sh validate \
            -var "image_version=$IMAGE_VERSION" \
            -var "release_version=$RELEASE_VERSION"

      # No `set -x` anywhere in this job: the payload staging shells out to
      # `docker pull` against a private repository, and a trace around it prints
      # the environment.
      - name: Build the ISO
        run: |
          packer/build.sh build \
            -var "image_version=$IMAGE_VERSION" \
            -var "release_version=$RELEASE_VERSION"

      - name: Identity stamp and checksum
        id: iso
        run: |
          set -eu
          iso="packer/build/iso/$ISO_NAME"
          test -f "$iso" || { echo "!! $iso was not produced" >&2; exit 1; }
          # make-node-iso.sh already wrote the .sha256 beside it, in the same
          # "<sha>  <name>" form install.sh reads for image archives and
          # `sha256sum -c` verifies. Recomputed here only to prove the file on
          # disk still matches what was stamped.
          ( cd packer/build/iso && sha256sum -c "$ISO_NAME.sha256" )
          {
            echo "### \`$ISO_NAME\`"
            echo
            echo "iso release \`$RELEASE_VERSION\` carrying node image"
            echo "\`nirlevi/va-crystal:node-$IMAGE_VERSION\` — two different numbers,"
            echo "both recorded on the disc."
            echo
            echo '```'
            cat packer/build/iso/add/va-crystal-node.txt
            echo
            cat "packer/build/iso/$ISO_NAME.sha256"
            echo "size: $(du -h "$iso" | cut -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "path=$iso" >> "$GITHUB_OUTPUT"

      # Small enough to keep on the run regardless of whether S3 accepted the
      # disc: the stamp and the checksum are what an operator needs to identify
      # media, and they are a few kilobytes.
      - name: Upload the stamp and checksum as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: voipappz-node-${{ steps.mint.outputs.release_version }}-manifest
          path: |
            packer/build/iso/${{ env.ISO_NAME }}.sha256
            packer/build/iso/add/va-crystal-node.txt
          if-no-files-found: error

      # A SECOND, fresh session. The one taken to mint is an hour old by now and
      # the build in between can run for most of that.
      - name: Assume the publishing role (to upload)
        if: ${{ inputs.publish && (vars.AWS_OIDC_ROLE_ARN != '' || secrets.AWS_ACCESS_KEY_ID != '') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          role-session-name: node-iso-put-${{ github.run_id }}
          aws-region: ${{ vars.ISO_S3_REGION || 'il-central-1' }}

      - name: Publish to S3
        if: ${{ inputs.publish && (vars.AWS_OIDC_ROLE_ARN != '' || secrets.AWS_ACCESS_KEY_ID != '') }}
        run: |
          set -eu
          # Exactly one trailing slash, whatever the input looked like.
          prefix="${S3_PREFIX%/}/"
          case "$prefix" in /*) prefix="${prefix#/}" ;; esac
          dest="s3://$S3_BUCKET/$prefix"
          echo ">> ${dest}voipappz-node-latest.iso  (from $ISO_NAME)"
          # NO --acl. The disc carries a private image, so it inherits the
          # bucket's Block Public Access and stays owner-only; the role assumed
          # above cannot set an ACL even if this line asked it to. Customers get
          # a presigned URL, minted by hand — packer/scripts/presign-iso.sh.
          #
          # voipappz-node-<release>.iso, deliberately NOT va-crystal-node-: that
          # name already belongs to va-crystal's image tarballs in this same
          # bucket, versioned by a different repository. One namespace, two
          # meanings, is how an operator downloads the wrong thing.
          # ONE OBJECT, OVERWRITTEN. Not a versioned disc plus a `latest` copy:
          # S3 has no symlink, so that pair costs ~9GB per release and the
          # versioned halves are immutable, which means the prefix grows without
          # end. The disc still KNOWS what it is — the stamp at its root carries
          # the iso release, the node image tag and its digest — so the version
          # lives in the artefact rather than in the filename.
          #
          # voipappz-node-latest.iso, deliberately NOT va-crystal-node-: that
          # name already belongs to va-crystal's image tarballs in this same
          # bucket, versioned by a different repository. One namespace, two
          # meanings, is how an operator downloads the wrong thing.
          #
          # NO --acl. The disc carries a private image, so it inherits the
          # bucket's Block Public Access and stays owner-only; the role assumed
          # above cannot set an ACL even if this line asked it to. Customers get
          # a presigned URL, minted by hand — packer/scripts/presign-iso.sh.
          aws s3 cp "packer/build/iso/$ISO_NAME" "${dest}voipappz-node-latest.iso" \
            --region "$S3_REGION" \
            --content-type application/x-iso9660-image \
            --only-show-errors
          aws s3 cp "packer/build/iso/$ISO_NAME.sha256" "${dest}voipappz-node-latest.iso.sha256" \
            --region "$S3_REGION" \
            --content-type text/plain \
            --only-show-errors
          echo ">> ${dest}voipappz-node-latest.iso  (overwritten; release $RELEASE_VERSION)"
          {
            echo
            echo "published to \`$dest$ISO_NAME\` — RESTRICTED, no public ACL."
            echo
            echo "It carries the private node image. Hand it to a customer with a"
            echo "presigned URL, never a plain link and never a re-host:"
            echo
            echo '```sh'
            echo "packer/scripts/presign-iso.sh $RELEASE_VERSION"
            echo '```'
            echo
            echo "A presigned URL is a bearer credential, so it is never minted in"
            echo "CI and never printed into a job log — this log is world-readable."
          } >> "$GITHUB_STEP_SUMMARY"

      # A RELEASE THAT NAMES THE DISC WITHOUT CARRYING IT. The ISO is ~3GB and a
      # release asset is capped at 2GB, so the artefact stays in S3 and the
      # release is the INDEX: which node image is inside, where the object is,
      # and its checksum. The s3:// URI is deliberately not a download link —
      # the object is restricted, and a presigned URL is a bearer credential
      # that must never live in a public release.
      - name: Publish the release
        if: ${{ inputs.publish && inputs.release && (vars.AWS_OIDC_ROLE_ARN != '' || secrets.AWS_ACCESS_KEY_ID != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prefix="${S3_PREFIX%/}/"
          case "$prefix" in /*) prefix="${prefix#/}" ;; esac
          sum="$(cut -d' ' -f1 < "packer/build/iso/$ISO_NAME.sha256")"
          notes="$(mktemp)"
          {
            echo "Node installer ISO \`$RELEASE_VERSION\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| node image | \`nirlevi/va-crystal:node-$IMAGE_VERSION\` |"
            echo "| installer commit | \`$GITHUB_SHA\` |"
            echo "| object | \`s3://$S3_BUCKET/${prefix}voipappz-node-latest.iso\` (overwritten each release) |"
            echo "| sha256 | \`$sum\` |"
            echo
            echo "**Restricted media.** The disc contains the private node image, so it"
            echo "is not attached here and the object has no public ACL. Hand it over"
            echo "with a presigned URL minted out of band:"
            echo
            echo '```sh'
            echo "packer/scripts/presign-iso.sh $RELEASE_VERSION"
            echo '```'
            echo
            echo "Boot it, let it install and power off, remove the disc, boot again,"
            echo "log in and run \`va-node-install\`. The image is offline; registration"
            echo "still needs the mothership (\`VA_REGISTER=0\` to defer it)."
          } > "$notes"
          gh release create "iso-$RELEASE_VERSION" \
            --title "Node ISO $RELEASE_VERSION" \
            --notes-file "$notes" \
            "packer/build/iso/$ISO_NAME.sha256#$ISO_NAME.sha256"
          echo "release iso-$RELEASE_VERSION published" >> "$GITHUB_STEP_SUMMARY"

      - name: Say why nothing was published
        if: ${{ inputs.publish && vars.AWS_OIDC_ROLE_ARN == '' && secrets.AWS_ACCESS_KEY_ID == '' }}
        run: |
          echo "!! No AWS credentials (AWS_OIDC_ROLE_ARN variable, or AWS_ACCESS_KEY_ID secret) — built, not uploaded." >&2
          echo "   Set the repository variable to the role described at the top of this workflow." >&2

      - name: Remove the registry credential
        if: always()
        run: |
          set -eu
          docker logout >/dev/null 2>&1 || true
          rm -f "$HOME/.docker/config.json"
