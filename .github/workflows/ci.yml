name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell / Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v7
      - name: Validate scripts
        run: |
          test -x install.sh
          sh -n install.sh
          dash -n install.sh
          bash -n tests/clean-runner.sh tests/test-install.sh tests/unit.sh tests/two-pbx.sh
          # Preinstalled on a GitHub runner, absent from act's image — these
          # two lines are so `act -j shell` runs the same gate locally. The
          # update is not optional: act's image ships an EMPTY package list, so
          # the install alone fails with "Unable to locate package shellcheck",
          # which reads as a missing package rather than a missing index.
          command -v shellcheck >/dev/null || { sudo apt-get update -qq \
            && sudo apt-get install -y -qq shellcheck; }
          shellcheck install.sh tests/clean-runner.sh tests/test-install.sh tests/unit.sh tests/two-pbx.sh
          git diff --check
          test -z "$(find tests -type f -name '*.py' -print -quit)"
          ! grep -Eq 'python(3)?' install.sh
          bash tests/unit.sh
          # THE MAKE TARGETS EXIST AND EXPAND. `-n` needs no Docker and no
          # node, so this runs on every push: it catches a target renamed in
          # one place and not the other, a typo in a recipe, and a name
          # dropped from .PHONY. What the commands DO is proved by the
          # integration job, which has a node to run them against.
          for t in help check check-make get install \
                   setup verify up down logs health cli \
                   build \
                   iso iso-payload iso-clean iso-deliver iso-ship iso-node-install \
                   iso-upload image-cloud image-ami image-virtualbox \
                   image-disk-direct image-disk-from-iso image-validate; do
            echo "=== make $t ==="
            make -n "$t" || { echo "!! make $t does not resolve" >&2; exit 1; }
          done
          # The flags the docs promise, expanded. `help` itself is generated
          # from the `##` comments, so it cannot name a target that is not
          # there; what it CAN do is lose one, which check-make catches.
          make -n get                     | grep -q -- --image-only
          make -n get registry            | grep -q "VA_IMAGE_SOURCE='registry'"
          make -n get dockerhub           | grep -q "VA_IMAGE_SOURCE='dockerhub'"
          make -n get SOURCE=dockerhub    | grep -q "VA_IMAGE_SOURCE='dockerhub'"
          make -n install                 | grep -q 'VA_IMAGE_SOURCE=local'
          make -n install REGISTER=0      | grep -q -- --no-register
          make -n build                   | grep -q "docker create"
          # The media targets' knobs, same idea: QUICK re-cuts from an
          # unchanged payload, ISO_DEST decides where the disc lands, and an
          # ISO_HOST-less delivery must refuse rather than build.
          make -n iso QUICK=1             | grep -q "refresh_packages=false"
          make -n iso ISO_DEST=/tmp/isos  | grep -q "dest_dir=/tmp/isos"
          if make -n iso | grep -q "dest_dir="; then echo "!! iso names a dest_dir with none set" >&2; exit 1; fi
          make -n iso-deliver             | grep -q 'set ISO_HOST'
          make check-make

  # A NODE ON A CLEAN HOST, WITH NOTHING ELSE. The integration job below proves
  # registration against a real mothership; this one proves the thing that job
  # cannot isolate — that `docker run` gets the capabilities and ulimits a
  # real-time SIP plane needs. They can only come from the runtime: nothing
  # inside the image can raise its own rtprio or memlock, so if this script
  # stops passing them, FreeSWITCH loses real-time scheduling silently and only
  # under load. Nothing else in CI looks at the container's HostConfig.
  #
  # No mothership is checked out or booted. The node needs two things to reach
  # health, and both are stood up here in three lines:
  #   * a broker — fatal without one; the node exits(1) and s6 restarts it
  #   * a mothership that ANSWERS — a 200 on /health is enough, and
  #     install.sh permits plain HTTP on loopback (validate_api_url), which is
  #     what makes a static file server a legitimate stand-in rather than a
  #     hole poked in the rules.
  container:
    name: Node starts with real-time limits / Ubuntu ${{ matrix.ubuntu }}
    # Push, manual runs, and pull requests from THIS repository: those carry the
    # registry secrets, so a change is proven before main has it. Fork PRs and
    # Dependabot get no such secrets, so they skip, as they always have.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v7

      - name: A broker and a mothership that answers
        run: |
          set -eu
          # The API token secret a current node image refuses to start without.
          # install.sh records it and never invents it, and `make up` requires
          # it by name, so the run brings its own: masked, never a real one.
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "VA_SECRET_KEY=$key" >> "$GITHUB_ENV"
          docker run -d --name ci-nats --network host nats:2-alpine >/dev/null
          mkdir -p stub && : > stub/health
          nohup python3 -m http.server 5000 --bind 127.0.0.1 --directory stub \
            >/dev/null 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null -m 2 http://127.0.0.1:5000/health && break
            sleep 1
          done
          curl -fsS -o /dev/null -m 2 http://127.0.0.1:5000/health

      - name: Install a node, no registration
        env:
          VA_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          VA_REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # The Docker Hub copy, which these secrets can read. Switch to
          # ghcr.io/voipappz/node:latest once the repo holds a GitHub
          # read:packages token (install.sh's default since 2026-10-22).
          VA_VOIP_IMAGE: nirlevi/va-crystal:node
          VA_API_URL: http://127.0.0.1:5000
          VA_NATS_URL: nats://127.0.0.1:4222
        run: sh install.sh --no-register

      - name: The container has the limits only the runtime can give it
        run: |
          set -eu
          inspect() { docker inspect va-voip --format "$1"; }
          echo "--- HostConfig ---"
          docker inspect va-voip --format \
            'caps={{.HostConfig.CapAdd}}{{"\n"}}ulimits={{json .HostConfig.Ulimits}}'
          for cap in NET_ADMIN NET_RAW SYS_RESOURCE SYS_NICE IPC_LOCK; do
            inspect '{{.HostConfig.CapAdd}}' | grep -q "$cap" \
              || { echo "!! missing capability $cap" >&2; exit 1; }
          done
          for lim in rtprio nice memlock nofile; do
            inspect '{{json .HostConfig.Ulimits}}' | grep -q "\"$lim\"" \
              || { echo "!! missing ulimit $lim" >&2; exit 1; }
          done
          # And that they REACHED the process, not just the config: FreeSWITCH
          # is what needs them, so ask inside the container.
          #
          # /proc/self/limits, not `ulimit -r`: that flag is a bash extension
          # and the image's /bin/sh is dash, where it prints nothing and the
          # test passes an empty string around. The kernel's own view cannot be
          # shell-dependent.
          echo "--- as the node sees them ---"
          docker exec va-voip sh -c 'grep -E "^Max (realtime priority|locked memory|open files)" /proc/self/limits'
          docker exec va-voip sh -c \
            'grep -q "^Max realtime priority *99 *99" /proc/self/limits' \
            || { echo "!! rtprio did not reach the process" >&2; exit 1; }
          docker exec va-voip sh -c \
            'grep -q "^Max locked memory *unlimited *unlimited" /proc/self/limits' \
            || { echo "!! memlock did not reach the process" >&2; exit 1; }

      # THE MAKE TARGETS, RUN FOR REAL, AGAINST THE INSTALLATION. The shell job
      # proves they expand; only here is there a node to point them at. `make up`
      # reads ./.env and ./config/va.yaml by default (a checkout's node), so an
      # installed node is named by its own two files, the form `make verify`
      # documents. `up` recreates the container, so its guard matters more than
      # the recipe: install.sh writes .env 0600 root-owned, and an unprivileged
      # `make up` must refuse BEFORE `docker rm -f`. A guard that fires
      # afterwards leaves the host with no node. Each refusal is held to its own
      # message: refusing for the WRONG reason is how this step once passed
      # while `make up` could not start anything at all.
      - name: make up / down / health drive the installed node
        run: |
          set -eu
          node_running() {
            docker inspect -f '{{.State.Running}}' va-voip | grep -qx true \
              || { echo "!! the refusal destroyed the container" >&2; exit 1; }
          }
          refuses() {  # expected message, make arguments...
            want=$1; shift
            if out=$(make up "$@" 2>&1); then
              printf '%s\n' "$out"
              echo "!! make up $* should have refused" >&2; exit 1
            fi
            printf '%s\n' "$out"
            printf '%s\n' "$out" | grep -qF -- "$want" \
              || { echo "!! make up refused, but not with: $want" >&2; exit 1; }
            node_running
          }

          # NOTHING INSTALLED THERE.
          echo "=== make up at /tmp/not-installed: must refuse ==="
          refuses "no /tmp/not-installed/.env" \
            VA_ENV_FILE=/tmp/not-installed/.env VA_CONFIG=/tmp/not-installed/config/va.yaml

          # THE LAYOUT AN OPERATOR ACTUALLY HAS. install.sh writes .env 0600
          # owned by root whenever it had to elevate, but GitHub runners ship
          # /opt world-writable, so here it correctly stayed unelevated and the
          # file is the runner's. Make it root's to get the real thing.
          sudo chown root:root /opt/voipappz/.env
          sudo chmod 600 /opt/voipappz/.env
          echo "=== make up, unprivileged, root-owned .env: must refuse ==="
          refuses "cannot read /opt/voipappz/.env" \
            VA_ENV_FILE=/opt/voipappz/.env VA_CONFIG=/opt/voipappz/config/va.yaml

          echo "=== sudo make down ==="
          sudo make down
          echo "=== sudo make up (the installation's two files) ==="
          sudo make up \
            VA_ENV_FILE=/opt/voipappz/.env VA_CONFIG=/opt/voipappz/config/va.yaml
          for _ in $(seq 1 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' va-voip)" = healthy ] && break
            sleep 2
          done
          echo "=== sudo make health ==="
          sudo make health

      - name: What the node says about itself
        if: always()
        run: |
          docker exec va-voip voipappz health || true
          docker ps -a --format '{{.Names}}\t{{.Status}}'

  integration:
    name: Clean install + real mothership / Ubuntu ${{ matrix.ubuntu }}
    # Push, manual runs, and pull requests from THIS repository: those carry the
    # registry secrets, so a change is proven before main has it. Fork PRs and
    # Dependabot get no such secrets, so they skip, as they always have.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - name: Check out public installer
        uses: actions/checkout@v7


      - name: Remove preinstalled Docker
        run: tests/clean-runner.sh

      - name: Install and register against real mothership
        env:
          VA_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          VA_REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # The Docker Hub copy, which these secrets can read. Switch to
          # ghcr.io/voipappz/node:latest once the repo holds a GitHub
          # read:packages token (install.sh's default since 2026-10-22).
          VA_VOIP_IMAGE: nirlevi/va-crystal:node
          # voipappz/mothership went private on 2026-09-04: its tarball now
          # needs a read token. This job already requires secrets (the registry
          # pair), so it is the one place in this workflow that can hold one —
          # unlike a job that runs on fork PRs and must answer at a
          # fixture instead.
          MOTHERSHIP_TOKEN: ${{ secrets.MOTHERSHIP_TOKEN }}
        # The mothership fixture is DOWNLOADED, never cloned — the same tarball
        # its own installer fetches.
        run: tests/test-install.sh

  # One mail per push to main, pass or fail, so a red main does not wait
  # to be noticed. Pull requests report on their own page and stay quiet.
  # SES credentials are repository secrets; without SMTP_PASSWORD the step
  # notices and skips rather than failing the run.
  notify:
    name: release email
    runs-on: ubuntu-latest
    needs: [shell, container, integration]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check SMTP credentials
        id: smtp
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "::notice::Release email skipped: no SMTP_PASSWORD repository secret"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send the release email
        if: steps.smtp.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_ADDRESS }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: VoipAppz CI <${{ secrets.SMTP_FROM }}>
          to: ${{ secrets.SMTP_TO }}
          subject: >-
            installer ${{ contains(needs.*.result, 'failure') && 'FAILED' || 'passed' }}:
            gh-${{ github.run_number }}
          body: |
            ${{ github.repository }} on main — ${{ github.sha }}

            shell             : ${{ needs.shell.result }}
            container         : ${{ needs.container.result }}
            integration       : ${{ needs.integration.result }}

            ${{ github.event.head_commit.message }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # THE MEDIA TEMPLATES. `packer validate` parses both .pkr.hcl files with
  # every variable and provisioner resolved — the cheapest thing that can fail
  # on a template edit, and it builds nothing. `make check` already asserts
  # that each -only= target names a source packer declares; this asserts the
  # sources themselves are valid.
  #
  # It runs in packer/Dockerfile.builder (build.sh builds it), so the runner
  # needs Docker and nothing else — no packer, no qemu, no xorriso.
  packer:
    name: Media / templates validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A fresh runner has no plugins: `packer validate` without them fails with
      # "Missing plugins". init downloads them into build.sh's plugin volume.
      - name: packer init
        run: packer/build.sh init .
      - name: packer validate
        run: make image-validate

  # THE DISC ITSELF — cut end to end, WITHOUT the node image.
  #
  # with_images=false is what makes this runnable in CI at all: the payload's
  # images are private and gigabytes, while everything this job is here to
  # catch — the autoinstall, the package closure, the remaster, the boot
  # records — is in the other 3GB. A disc that cannot boot fails here; a disc
  # missing its image fails `make iso` on a machine that has the credential.
  #
  # Manual, because it downloads Canonical's ISO and writes several GB.
  iso:
    name: Media / cut an image-less ISO
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Canonical's ISO is the one input this cannot produce. Cached, because
      # it is 3GB and never changes for a given point release — and fetched
      # with `-C -` because Packer's own downloader does not resume.
      - name: The base ISO
        id: base
        run: |
          iso=$(grep -oE 'ubuntu-[0-9.]+-live-server-amd64\.iso' packer/os-image.pkr.hcl | head -1)
          echo "name=$iso" >> "$GITHUB_OUTPUT"
          echo "release=$(echo "$iso" | sed -E 's/ubuntu-([0-9]+\.[0-9]+).*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: packer/cache
          key: base-iso-${{ steps.base.outputs.name }}
      - name: Fetch it if the cache was cold
        run: |
          iso=packer/cache/${{ steps.base.outputs.name }}
          [ -f "$iso" ] && { echo "cached: $(du -h "$iso" | cut -f1)"; exit 0; }
          mkdir -p packer/cache
          curl -fL -C - --retry 10 -o "$iso" \
            "https://releases.ubuntu.com/${{ steps.base.outputs.release }}/${{ steps.base.outputs.name }}"
          du -h "$iso"

      - name: Cut it
        run: make iso ISO_VARS="-var with_images=false"

      # A disc is not a file that exists: it has to carry both boot records, or
      # it installs on neither BIOS nor UEFI and the only symptom is a machine
      # that will not boot from it.
      - name: It is a bootable disc, and it carries the installer payload
        run: |
          iso=$(find packer/build/iso -name 'voipappz-os-*.iso' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2)
          ls -lh "$iso"
          sudo apt-get update -qq && sudo apt-get install -y -qq xorriso >/dev/null
          xorriso -indev "$iso" -report_el_torito plain 2>&1 | tee /tmp/torito
          grep -q 'El Torito' /tmp/torito
          xorriso -indev "$iso" -find /voipappz -type f 2>&1 | tee /tmp/payload
          grep -q 'debs' /tmp/payload
