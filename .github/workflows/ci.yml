name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell / Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v7
      - name: Validate scripts
        run: |
          test -x install.sh
          sh -n install.sh
          dash -n install.sh
          sh -n scripts/install-cli.sh && dash -n scripts/install-cli.sh
          bash -n tests/clean-runner.sh tests/test-install.sh tests/unit.sh tests/two-pbx.sh
          # Preinstalled on a GitHub runner, absent from act's image — these
          # two lines are so `act -j shell` runs the same gate locally. The
          # update is not optional: act's image ships an EMPTY package list, so
          # the install alone fails with "Unable to locate package shellcheck",
          # which reads as a missing package rather than a missing index.
          command -v shellcheck >/dev/null || { sudo apt-get update -qq \
            && sudo apt-get install -y -qq shellcheck; }
          shellcheck install.sh scripts/install-cli.sh tests/clean-runner.sh tests/test-install.sh tests/unit.sh tests/two-pbx.sh
          git diff --check
          test -z "$(find tests -type f -name '*.py' -print -quit)"
          ! grep -Eq 'python(3)?' install.sh
          bash tests/unit.sh
          # THE MAKE TARGETS EXIST AND EXPAND. `-n` needs no Docker and no
          # node, so this runs on every push: it catches a target renamed in
          # one place and not the other, a typo in a recipe, and a name
          # dropped from .PHONY. What the commands DO is proved by the
          # integration job, which has a node to run them against.
          for t in help check check-make get install \
                   up down logs health cli node-preflight \
                   build cli-build cli-node-build cli-test install-cli; do
            echo "=== make $t ==="
            make -n "$t" || { echo "!! make $t does not resolve" >&2; exit 1; }
          done
          # The flags the docs promise, expanded. `help` itself is generated
          # from the `##` comments, so it cannot name a target that is not
          # there; what it CAN do is lose one, which check-make catches.
          make -n get                     | grep -q -- --image-only
          make -n get SOURCE=dockerhub    | grep -q "VA_IMAGE_SOURCE='dockerhub'"
          make -n install                 | grep -q 'VA_IMAGE_SOURCE=local'
          make -n install REGISTER=0      | grep -q -- --no-register
          make check-make

  # THE CLI, built and tested here since 2026-09-03, when cli/ moved in from
  # the mothership so it can be public while the mothership is not.
  #
  # A SEPARATE JOB, deliberately. `shell` above stays a POSIX gate with no
  # compiler in reach: install.sh is one script piped into sh, and its checks
  # must keep passing on a machine that could not compile anything.
  #
  # Specs AND a link, in that order. A suite that passes while the artifact
  # fails to link leaves nothing to ship — and the release workflow is not the
  # place to discover that on a tag.
  cli:
    name: cli · specs + static link + SIPp round-trip
    runs-on: ubuntu-latest
    # Only this job publishes, and only the rolling `latest` release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Specs
        run: make cli-test

      # --static, and it matters beyond this repo: the mothership's SIP suites
      # and its ISO run the binary FROM THE HOST, where a musl dynamic build
      # cannot exec.
      - name: Static build links and runs
        run: |
          make build
          ./bin/voipappz --version
          file bin/voipappz | grep -q 'statically linked'

      # The other program from the same source. `status` present in one and
      # absent in the other is the cheapest proof the -Dnode_runtime build
      # really dropped the host lifecycle surface — va-crystal's
      # assert-runtime-image.sh rejects an image that carries it, remotely.
      - name: The node build is the node build
        run: |
          make cli-node-build
          ./cli/bin/voipappz-node --version
          ./bin/voipappz --help | grep -qE '^[[:space:]]+status\b' || {
            echo "!! the host build has no 'status' — is this the node binary?" >&2; exit 1; }
          if ./cli/bin/voipappz-node --help | grep -qE '^[[:space:]]+status\b'; then
            echo "!! the -Dnode_runtime build still carries the host lifecycle surface" >&2
            exit 1
          fi

      # BOTH BINARIES, EVERY RUN. The mothership's CI installs a stack and a
      # node with the host one rather than compiling a second copy, and
      # va-crystal bakes the node one into its image — so every push should
      # leave something they can take. A week, not a day: a branch reviewed on
      # Friday still has its binary on Monday.
      - name: Keep the binaries
        uses: actions/upload-artifact@v4
        with:
          name: voipappz-linux-amd64
          path: |
            bin/voipappz
            cli/bin/voipappz-node
          retention-days: 7

      # A STABLE URL for the newest main. Artifacts need a GitHub token and an
      # API call to fetch; a release asset is a plain https download, which is
      # what an installer, a Dockerfile or a workstation can actually use
      # without credentials. `latest` is rolling and marked prerelease: the
      # v* tags release.yml publishes stay the immutable, citable ones.
      #
      # ACT skips it — a local run has no token and nothing to publish to.
      - name: Publish the rolling `latest` binaries
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cp bin/voipappz            voipappz-linux-amd64
          cp cli/bin/voipappz-node   voipappz-node-linux-amd64
          sha256sum voipappz-linux-amd64      > voipappz-linux-amd64.sha256
          sha256sum voipappz-node-linux-amd64 > voipappz-node-linux-amd64.sha256
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --prerelease --title 'latest (rolling)' \
            --notes 'The newest main build. Replaced by every push to main; pin a v* tag for a binary that will not move.'
          gh release upload latest --clobber \
            voipappz-linux-amd64 voipappz-linux-amd64.sha256 \
            voipappz-node-linux-amd64 voipappz-node-linux-amd64.sha256
          gh release edit latest --notes "The newest main build ($GITHUB_SHA). Replaced by every push to main; pin a v* tag for a binary that will not move."

      # THE CLI AT A REAL TERMINAL, a to z. Every step above pipes, and the
      # CLI branches on STDIN.tty?/STDOUT.tty? throughout — the setup wizard
      # blocks on stdin only when it has one, the tables draw, the line editor
      # arms. A prompt that moved, vanished or was reworded is invisible to all
      # of them. Moved here from the mothership on 2026-09-04: the prompts it
      # asserts are cli/src/commands/setup.cr's, so the test now sits with the
      # code it tests.
      #
      # `setup` and `status` need a PROJECT — a directory with a
      # docker-compose.yaml — and write config/va.yaml and .env into it. That
      # is cli/spec/fixtures/project, the same fixture the spec suite resolves
      # through VA_PROJECT_DIR, copied so the assertions below read a file this
      # run wrote.
      #
      # NOT the real mothership. It was, for one run: downloaded as a public
      # tarball the way tests/test-install.sh takes it. That repository went
      # private on 2026-09-04 and the step 404'd. A public repo's CI cannot
      # depend on a private one without a credential, and this job runs on fork
      # PRs where no secret is available — so the fixture is the only honest
      # answer. What is under test is the CLI's prompts, not the mothership.
      - name: A project to answer at, and expect to do the typing
        run: |
          cp -r cli/spec/fixtures/project /tmp/project
          echo "MS=/tmp/project" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq expect >/dev/null

      - name: The CLI answers at a real terminal, a to z
        run: expect tests/tty-cli.exp "$PWD/bin/voipappz" "$MS" /tmp/tty-cli.log

      - name: What was typed at the terminal reached the configuration
        # The four answers that are TYPED. The two IP answers are Enter, so
        # they are not asserted: setup heals an address that is not bound on
        # this host back to one that is, and asserting a healed value would be
        # asserting the healer rather than the prompt.
        run: |
          grep -q '^  name: Terminal Org$'        "$MS/config/va.yaml"
          grep -q '^  domain: cli.ci.example$'    "$MS/config/va.yaml"
          grep -q '^  email: cli@cli.ci.example$' "$MS/config/va.yaml"
          grep -q '^  environment: staging$'      "$MS/config/va.yaml"
          # And --dry-run leaked nothing. It is the flag people paste into an
          # issue, and VA_NATS_URL carries a password inside a value whose key
          # does not say so — which an earlier version of it printed in full.
          ! grep -q 's3cr3t-not-a-real-password' /tmp/tty-cli.log
          ! grep -q 'Y2xpQGV4YW1wbGU6c3VwZXJzZWNyZXQ=' /tmp/tty-cli.log
          echo "tty: four typed answers reached config/va.yaml, no secret reached the transcript"

      # Two checks, both self-contained: no node, no registry, no target. The
      # first run also fetches the pinned SIPp, so the download and its
      # checksum are covered here too.
      - name: SIPp scenario round-trip
        run: |
          # GitHub hands this step `bash -e`, and `set -uo pipefail` does not
          # clear it. Half the commands below MUST fail — that is the negative
          # assertion — so under -e the shell dies on the expected failure
          # before the line that judges it ever runs. Verdicts are read from
          # captured exit codes here, so -e has to go.
          set +e
          set -uo pipefail

          cat > /tmp/offer.yml <<'YML'
          name: ci-offer
          to: echo
          number_of_calls: 1
          max_concurrent: 1
          calls_per_second: 1
          ptime: 20
          maxptime: 30
          steps:
            - invite
            - wait_for_answer
            - ack_answer
            - hangup
          YML
          sed '/ptime/d' /tmp/offer.yml > /tmp/bare.yml

          # 1. Assertions, both directions. `trunk-offer-check` listens and
          # checks the SDP it is offered; a client dials it.
          #
          # The negative case is the point. That a compliant offer passes only
          # proves the scenario ran; that a NON-compliant one FAILS proves
          # check_it is wired to the call's verdict, which is the whole reason
          # to write the check instead of reading a capture.
          timeout 120 ./bin/voipappz test scenario trunk-offer-check --out /tmp/uas & server=$!
          sleep 5
          timeout 120 ./bin/voipappz test scenario /tmp/offer.yml --out /tmp/uac -d 127.0.0.1:5080
          client=$?
          wait $server; served=$?
          [ $client -eq 0 ] || { echo "!! the client scenario failed (exit $client)" >&2; exit 1; }
          [ $served -eq 0 ] || { echo "!! assert_body rejected a compliant offer (exit $served)" >&2; exit 1; }

          timeout 120 ./bin/voipappz test scenario trunk-offer-check --out /tmp/uas2 & server=$!
          sleep 5
          timeout 120 ./bin/voipappz test scenario /tmp/bare.yml --out /tmp/uac2 -d 127.0.0.1:5080 || true
          wait $server; served=$?
          [ $served -ne 0 ] || { echo "!! assert_body passed an offer with no a=ptime — check_it is not wired" >&2; exit 1; }

          # 2. Media. `call` carries three seconds of RTP, so this exercises the
          # generated pcap and the raw socket replaying it needs.
          #
          # The far end is SIPp's OWN uas, not another of our scenarios: two of
          # ours meeting with media trips a segfault inside SIPp's pcap cleanup
          # AFTER the dialog completes (both 200s sent, BYE answered). That is
          # SIPp's bug, not the scenario's, and it must not gate this repo.
          .cache/sipp -sn uas -p 5085 -m 1 -nostdin >/tmp/uas-builtin.log 2>&1 & farend=$!
          sleep 3
          # Keep the far end's output: a uas that died on startup would
          # otherwise show up only as a client that dialled nothing.
          kill -0 $farend 2>/dev/null || {
            echo "!! SIPp's own uas did not stay up" >&2
            cat /tmp/uas-builtin.log >&2
            exit 1
          }
          timeout 120 ./bin/voipappz test scenario call --to echo -d 127.0.0.1:5085 --out /tmp/media
          media=$?
          # Reaped, never waited on: `-m 1` only exits once a call arrives, so
          # a client that never dialled would hang this step until the job
          # timeout instead of reporting the failure it already knows about.
          kill $farend 2>/dev/null
          wait $farend 2>/dev/null
          [ $media -eq 0 ] || { echo "!! the media scenario failed (exit $media)" >&2; exit 1; }
          echo "round trip ok: offer asserted both ways, media replayed"

  # A NODE ON A CLEAN HOST, WITH NOTHING ELSE. The integration job below proves
  # registration against a real mothership; this one proves the thing that job
  # cannot isolate — that `docker run` gets the capabilities and ulimits a
  # real-time SIP plane needs. They can only come from the runtime: nothing
  # inside the image can raise its own rtprio or memlock, so if this script
  # stops passing them, FreeSWITCH loses real-time scheduling silently and only
  # under load. Nothing else in CI looks at the container's HostConfig.
  #
  # No mothership is checked out or booted. The node needs two things to reach
  # health, and both are stood up here in three lines:
  #   * a broker — fatal without one; the node exits(1) and s6 restarts it
  #   * a mothership that ANSWERS — a 200 on /health is enough, and
  #     install.sh permits plain HTTP on loopback (validate_api_url), which is
  #     what makes a static file server a legitimate stand-in rather than a
  #     hole poked in the rules.
  container:
    name: Node starts with real-time limits / Ubuntu ${{ matrix.ubuntu }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v7

      - name: A broker and a mothership that answers
        run: |
          set -eu
          docker run -d --name ci-nats --network host nats:2-alpine >/dev/null
          mkdir -p stub && : > stub/health
          nohup python3 -m http.server 5000 --bind 127.0.0.1 --directory stub \
            >/dev/null 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null -m 2 http://127.0.0.1:5000/health && break
            sleep 1
          done
          curl -fsS -o /dev/null -m 2 http://127.0.0.1:5000/health

      - name: Install a node, no registration
        env:
          VA_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          VA_REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VA_API_URL: http://127.0.0.1:5000
          VA_NATS_URL: nats://127.0.0.1:4222
        run: sh install.sh --no-register

      - name: The container has the limits only the runtime can give it
        run: |
          set -eu
          inspect() { docker inspect va-voip --format "$1"; }
          echo "--- HostConfig ---"
          docker inspect va-voip --format \
            'caps={{.HostConfig.CapAdd}}{{"\n"}}ulimits={{json .HostConfig.Ulimits}}'
          for cap in NET_ADMIN NET_RAW SYS_RESOURCE SYS_NICE IPC_LOCK; do
            inspect '{{.HostConfig.CapAdd}}' | grep -q "$cap" \
              || { echo "!! missing capability $cap" >&2; exit 1; }
          done
          for lim in rtprio nice memlock nofile; do
            inspect '{{json .HostConfig.Ulimits}}' | grep -q "\"$lim\"" \
              || { echo "!! missing ulimit $lim" >&2; exit 1; }
          done
          # And that they REACHED the process, not just the config: FreeSWITCH
          # is what needs them, so ask inside the container.
          #
          # /proc/self/limits, not `ulimit -r`: that flag is a bash extension
          # and the image's /bin/sh is dash, where it prints nothing and the
          # test passes an empty string around. The kernel's own view cannot be
          # shell-dependent.
          echo "--- as the node sees them ---"
          docker exec va-voip sh -c 'grep -E "^Max (realtime priority|locked memory|open files)" /proc/self/limits'
          docker exec va-voip sh -c \
            'grep -q "^Max realtime priority *99 *99" /proc/self/limits' \
            || { echo "!! rtprio did not reach the process" >&2; exit 1; }
          docker exec va-voip sh -c \
            'grep -q "^Max locked memory *unlimited *unlimited" /proc/self/limits' \
            || { echo "!! memlock did not reach the process" >&2; exit 1; }

      # THE MAKE TARGETS, RUN FOR REAL. The shell job proves they expand;
      # only here is there a node to point them at. `up` recreates the
      # container, so its guard matters more than the recipe: install.sh
      # writes .env 0600 root-owned, and an unprivileged `make up` must refuse
      # BEFORE `docker rm -f` — a guard that fires afterwards leaves the host
      # with no node, which is exactly the bug this step exists to catch.
      - name: make up / down / health drive the installed node
        run: |
          set -eu
          # NOTHING INSTALLED THERE. The guard must refuse, and must not have
          # touched the running node to find that out.
          echo "=== make up INSTALL_DIR=/tmp/not-installed: must refuse ==="
          if make up INSTALL_DIR=/tmp/not-installed; then
            echo "!! make up should have refused" >&2; exit 1
          fi
          docker inspect -f '{{.State.Running}}' va-voip | grep -qx true \
            || { echo "!! the refusal destroyed the container" >&2; exit 1; }

          # THE LAYOUT AN OPERATOR ACTUALLY HAS. install.sh writes .env 0600
          # owned by root whenever it had to elevate — but GitHub runners ship
          # /opt world-writable, so here it correctly stayed unelevated and the
          # file is the runner's. Make it root's to get the real thing.
          sudo chown root:root /opt/voipappz/.env
          sudo chmod 600 /opt/voipappz/.env
          echo "=== make up, unprivileged, root-owned .env: must refuse ==="
          if make up; then echo "!! make up read a root-only .env" >&2; exit 1; fi
          docker inspect -f '{{.State.Running}}' va-voip | grep -qx true \
            || { echo "!! the refusal destroyed the container" >&2; exit 1; }

          echo "=== sudo make down ==="
          sudo make down
          echo "=== sudo make up ==="
          sudo make up
          for _ in $(seq 1 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' va-voip)" = healthy ] && break
            sleep 2
          done
          echo "=== sudo make health ==="
          sudo make health

      - name: What the node says about itself
        if: always()
        run: |
          docker exec va-voip voipappz health || true
          docker ps -a --format '{{.Names}}\t{{.Status}}'

  integration:
    name: Clean install + real mothership / Ubuntu ${{ matrix.ubuntu }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - name: Check out public installer
        uses: actions/checkout@v7


      - name: Remove preinstalled Docker
        run: tests/clean-runner.sh

      - name: Install and register against real mothership
        env:
          VA_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          VA_REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # voipappz/mothership went private on 2026-09-04: its tarball now
          # needs a read token. This job already requires secrets (the registry
          # pair), so it is the one place in this workflow that can hold one —
          # unlike the `cli` job, which runs on fork PRs and answers at a
          # fixture instead.
          MOTHERSHIP_TOKEN: ${{ secrets.MOTHERSHIP_TOKEN }}
        # The mothership fixture is DOWNLOADED, never cloned — the same tarball
        # its own installer fetches.
        run: tests/test-install.sh
