name: release

# A release of this repository is the voipappz CLI, built from cli/:
#
#   voipappz-linux-amd64         THE CLI. `voipappz bootstrap` installs a
#                                mothership, `voipappz node install` launches
#                                install.sh, and va-crystal bakes this same
#                                binary into nirlevi/va-crystal:node.
#   voipappz-darwin-arm64        the same CLI for laptops; nothing depends on it
#
# ONE linux asset since 2026-09-07. There used to be a second,
# voipappz-node-linux-amd64, compiled with `-Dnode_runtime` to drop the compose
# lifecycle commands. The CLI decides at RUNTIME where it is (a service catalog
# means a stack; kamctl on PATH means the inside of the node image), so the
# flag was a second mechanism for a question already answered — and a second
# asset to build, checksum, pin and prove. va-crystal fetches this one.
#
# The source moved here from the mothership on 2026-09-03 so it can be public
# while the mothership is not: a public installer cannot fetch a release asset
# from a private repository, and va-crystal's image build has the same
# problem. install.sh does not consume any of these — it runs the CLI inside
# the node image — so a release here never changes what `curl | sh` installs.
#
# THE JOB GRAPH IS THE POINT. `publish: needs: build` over a matrix means one
# leg that cannot succeed skips the release entirely — the mothership's v0.1.2
# carried NO assets that way. So the producers are INDEPENDENT and each uploads
# its own work: a slow macOS queue cannot cost you the linux CLI.
#
# Trigger: push a version tag, e.g.  git tag v0.3.0 && git push origin v0.3.0
# (or run manually from the Actions tab).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version for the release (e.g. v0.3.0)"
        required: true

permissions:
  contents: write   # create the release + upload assets

env:
  # The image every build uses — workstation (`make build`), CI and release
  # alike, so a binary an operator builds locally is the binary that ships.
  # crystallang images are published for amd64 ONLY; a linux-arm64 job pulled
  # the amd64 image and died with `exec format error`, hence no arm64 leg.
  CRYSTAL_IMAGE: crystallang/crystal:1.16.3-alpine

jobs:
  # Creates the release so the producers below have somewhere to upload,
  # without any of them racing to create it. No compilation, no checkout of
  # consequence — this must never be the step that fails.
  prepare:
    name: create the release
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --title "$TAG" --generate-notes

  cli-linux:
    name: voipappz-linux-amd64
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --static (musl) is a CROSS-REPO contract, not a preference: va-crystal
      # copies this binary into a Debian-based image, and the SIP suites and the
      # ISO exec it from the host. Dropping it breaks both, remotely, with no
      # local signal. One container run, so `shards install` resolves once.
      #
      # The container runs as root, so what it writes is root-owned on the
      # runner and the `chmod +x` below is "Operation not permitted" — which is
      # exactly how the first run of this workflow failed. The binaries are
      # handed back to the runner's user before the container exits.
      - name: Build (linux, static)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/cli \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" "$CRYSTAL_IMAGE" sh -lc '
            set -eu
            shards install --skip-postinstall
            shards build voipappz --release --static --no-debug
            mv bin/voipappz ../voipappz-linux-amd64
            cd .. && chown "$HOST_UID:$HOST_GID" voipappz-linux-amd64 \
              && sha256sum voipappz-linux-amd64'

      # THE ASSET va-crystal PINS, so what it carries is checked before the
      # tag exists rather than when a node misbehaves. Both planes in one
      # `--help`: `status` is the stack's rollup, `node-monitor` the node's
      # screen. A release missing either means someone put a build-time surface
      # back — and a Dockerfile that pins this tag would bake it.
      #
      # Absence is `! grep -q`, never `grep -qv`: the latter succeeds when ANY
      # line fails to match, which is every multi-line help output ever
      # printed, so it passed unconditionally.
      - name: Smoke test
        run: |
          chmod +x voipappz-linux-amd64
          ./voipappz-linux-amd64 --version
          for command in status node-monitor sbc pbx health node setup; do
            ./voipappz-linux-amd64 --help | grep -qE "^[[:space:]]+$command\b" || {
              echo "!! the release binary has no '$command'" >&2; exit 1; }
          done

      - name: Checksums
        run: sha256sum voipappz-linux-amd64 > voipappz-linux-amd64.sha256

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            voipappz-linux-amd64 voipappz-linux-amd64.sha256

  # Convenience for developers on Apple silicon — `voipappz portal deploy` is a
  # laptop command. NOTHING depends on it: install-cli.sh fetches linux on
  # linux, and a macOS runner that queues for ten minutes must not be able to
  # hold a release hostage, which is precisely what a build matrix lets it do.
  cli-darwin:
    name: voipappz-darwin-arm64
    needs: prepare
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Pin the compiler: brew installs the latest, under which the mcp shard
      # fails to compile.
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.16.3

      # No --static: Crystal cannot statically link on Darwin.
      - name: Build (macOS)
        working-directory: cli
        run: |
          shards install --skip-postinstall
          shards build voipappz --release --no-debug
          mv bin/voipappz ../voipappz-darwin-arm64

      - name: Smoke test
        run: |
          ./voipappz-darwin-arm64 --version
          shasum -a 256 voipappz-darwin-arm64 > voipappz-darwin-arm64.sha256

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            voipappz-darwin-arm64 voipappz-darwin-arm64.sha256
